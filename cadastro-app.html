<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061d40">
<title>Cadastro | Colonial Esporte Clube</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(150deg, #123c70, #041329);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 28px 24px;
}

.logo {
    display: block;
    width: 100px;
    height: auto;
    margin: 15px auto 22px;
}

h1 {
    font-size: 25px;
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #c9d9ed;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 28px;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 46px;
    padding: 12px;
    border: 1px solid #ccd9e8;
    border-radius: 8px;
    background: white;
    color: #152b45;
    font: 16px Arial, sans-serif;
    margin-bottom: 17px;
}

button {
    width: 100%;
    min-height: 44px;
    border: 0;
    border-radius: 8px;
    background: white;
    color: #061d40;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    padding: 12px;
}

button:disabled {
    opacity: .55;
    cursor: wait;
}

.link {
    display: block;
    text-align: center;
    color: #d4e4f6;
    font-size: 13px;
    margin-top: 20px;
}

#status {
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
    overflow-wrap: anywhere;
}

.error {
    color: #ffb5b5;
}

.success {
    color: #a9efc5;
}

[hidden] {
    display: none !important;
}
</style>
</head>

<body>

<main class="container">

<img class="logo"
     src="assets/brasao-colonial.png"
     alt="Brasão oficial do Colonial">

<h1 id="titulo">Crie sua conta</h1>

<p class="subtitle">
Faça parte da comunidade Colonial.
</p>

<form id="cadastro" hidden>

<label for="nome">Nome completo</label>
<input id="nome" type="text"
       autocomplete="name"
       minlength="3" maxlength="120" required>

<label for="telefone">Celular com DDD</label>
<input id="telefone" type="tel"
       autocomplete="tel"
       maxlength="15"
       placeholder="(21) 99999-9999" required>

<label for="email">E-mail</label>
<input id="email" type="email"
       autocomplete="email" required>

<label for="senha">Crie sua senha</label>
<input id="senha" type="password"
       autocomplete="new-password"
       minlength="8"
       placeholder="Mínimo de 8 caracteres" required>

<label for="confirmar">Confirme sua senha</label>
<input id="confirmar" type="password"
       autocomplete="new-password" required>

<button id="cadastrar" type="submit">
CRIAR MINHA CONTA
</button>

<a class="link" href="#" id="abrirLogin">
Já possui uma conta? Entrar
</a>

</form>

<form id="login" hidden>

<label for="loginEmail">E-mail</label>
<input id="loginEmail" type="email"
       autocomplete="username" required>

<label for="loginSenha">Senha</label>
<input id="loginSenha" type="password"
       autocomplete="current-password" required>

<button type="submit" id="entrar">
ENTRAR
</button>

<a href="#" class="link" id="abrirCadastro">
Ainda não possui conta? Cadastre-se
</a>

</form>

<p id="status" role="status"></p>

<button id="sair" type="button" hidden>
SAIR DA CONTA
</button>

<a class="link" href="associados.html">
Já é associado? Acesse sua carteirinha
</a>

<a class="link" href="./">
Voltar à abertura
</a>

</main>

<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="js/client.js"></script>

<script>
const sb = window.colonial?.client;
const $ = id => document.getElementById(id);

function mensagem(texto, tipo = '') {
    $('status').textContent = texto;
    $('status').className = tipo;
}

function mostrarCadastro() {
    $('titulo').textContent = 'Crie sua conta';
    $('cadastro').hidden = false;
    $('login').hidden = true;
}

function mostrarLogin() {
    $('titulo').textContent = 'Acesse sua conta';
    $('cadastro').hidden = true;
    $('login').hidden = false;
}

async function finalizarCadastro() {

    const { data, error } = await sb.auth.getUser();

    if (error || !data?.user) {
        throw new Error('Não foi possível validar seu acesso.');
    }

    const usuario = data.user;

    $('cadastro').hidden = true;
    $('login').hidden = true;
    $('sair').hidden = false;

    const consulta = await sb
        .from('usuarios_app')
        .select('nome,situacao')
        .eq('usuario_id', usuario.id)
        .maybeSingle();

    if (consulta.error) {
        throw new Error('Não foi possível consultar seu cadastro.');
    }

    let situacao = consulta.data?.situacao;

    if (!consulta.data) {

        const meta = usuario.user_metadata || {};

        if (meta.cadastro_colonial_app !== true) {
            mensagem(
                'Esta conta não pertence ao cadastro de usuários comuns. Utilize sua área de acesso.'
            );
            return;
        }

        const registro = await sb.rpc(
            'registrar_usuario_app',
            {
                p_nome: meta.nome,
                p_telefone: meta.telefone
            }
        );

        if (registro.error) {
            throw new Error(registro.error.message);
        }

        situacao = registro.data;
    }

    if (situacao !== 'ativo') {
        mensagem(
            'Seu acesso está indisponível. Entre em contato com a administração.',
            'error'
        );

        const resultado = await sb.auth.signOut();

        if (!resultado.error) {
            $('sair').hidden = true;
            mostrarLogin();
        }

        return;
    }
location.replace('./?inicio=1');
return;
    $('titulo').textContent = 'Bem-vindo!';

    mensagem(
        'Seu cadastro está confirmado. Você faz parte da comunidade Colonial!',
        'success'
    );
}

$('cadastro').addEventListener('submit', async event => {

    event.preventDefault();

    if (!sb || $('cadastrar').disabled) return;

    const nome = $('nome').value.trim();

    const telefone = $('telefone').value.replace(/\D/g, '');

    const email = $('email').value.trim();

    const senha = $('senha').value;

    if (nome.length < 3) {
        return mensagem('Informe seu nome completo.', 'error');
    }

    if (![10, 11].includes(telefone.length)) {
        return mensagem('Informe um telefone válido com DDD.', 'error');
    }

    if (senha.length < 8 || !/[^\p{L}\p{N}\s]/u.test(senha)) {
        return mensagem(
            'Use pelo menos 8 caracteres e um caractere especial.',
            'error'
        );
    }

    if (senha !== $('confirmar').value) {
        return mensagem('As senhas não coincidem.', 'error');
    }

    $('cadastrar').disabled = true;
    mensagem('Realizando cadastro...');

    try {

        const sessao = await sb.auth.getSession();

        if (sessao.error || sessao.data.session) {
            throw new Error('Encerre a sessão atual antes de criar outra conta.');
        }

        const { data, error } = await sb.auth.signUp({

            email: email,
            password: senha,

            options: {

                emailRedirectTo:
                    new URL('cadastro-app.html', location.href).href,

                data: {
                    cadastro_colonial_app: true,
                    nome: nome,
                    telefone: telefone
                }
            }
        });

        if (error) throw error;

        $('cadastro').reset();

        if (data.session) {

            await finalizarCadastro();

        } else {

            mostrarLogin();

            mensagem(
                'Confira sua caixa de entrada e o spam. Se o cadastro estiver pendente, confirme seu e-mail antes de entrar.',
                'success'
            );

        }

    } catch (erro) {

        mensagem(
            'Não foi possível concluir: ' + erro.message,
            'error'
        );

    } finally {

        $('cadastrar').disabled = false;

    }
});

$('login').addEventListener('submit', async event => {

    event.preventDefault();

    if (!sb || $('entrar').disabled) return;

    $('entrar').disabled = true;
    mensagem('Verificando acesso...');

    try {

        const { error } = await sb.auth.signInWithPassword({

            email: $('loginEmail').value.trim(),
            password: $('loginSenha').value

        });

        if (error) throw error;

        $('login').reset();

        await finalizarCadastro();

    } catch (erro) {

        mensagem(
            'Não foi possível entrar ou concluir o cadastro. Confira seus dados e a confirmação do e-mail.',
            'error'
        );

    } finally {

        $('entrar').disabled = false;

    }
});

$('abrirLogin').onclick = event => {
    event.preventDefault();
    mensagem('');
    mostrarLogin();
};

$('abrirCadastro').onclick = event => {
    event.preventDefault();
    mensagem('');
    mostrarCadastro();
};

$('sair').onclick = async () => {

    const { error } = await sb.auth.signOut();

    if (error) {
        return mensagem('Não foi possível sair.', 'error');
    }

    $('sair').hidden = true;
    mensagem('');
    mostrarLogin();
};

async function iniciar() {

    if (!sb) {
        return mensagem('Conexão indisponível.', 'error');
    }

    try {

        const { data, error } = await sb.auth.getSession();

        if (error) throw error;

        if (data.session) {
    await finalizarCadastro();
} else if (new URLSearchParams(location.search).get('modo') === 'login') {
    mostrarLogin();
} else {
    mostrarCadastro();
}

    } catch (erro) {
        mensagem(erro.message, 'error');
        $('sair').hidden = false;
    }
}

iniciar();
</script>

</body>
</html>
