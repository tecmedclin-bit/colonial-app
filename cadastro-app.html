<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061d40">
<title>Acesso | Colonial Esporte Clube</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(150deg,#123c70,#041329);color:white;min-height:100vh}
.container{max-width:420px;margin:auto;padding:28px 24px}
.logo{display:block;width:100px;height:auto;margin:15px auto 22px}
h1{font-size:25px;text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#c9d9ed;font-size:14px;line-height:1.5;margin-bottom:28px}
label{display:block;font-size:13px;margin-bottom:7px}
input{width:100%;height:46px;padding:12px;border:1px solid #ccd9e8;border-radius:8px;background:white;color:#152b45;font:16px Arial,sans-serif;margin-bottom:17px}
button{width:100%;min-height:44px;border:0;border-radius:8px;background:white;color:#061d40;font-size:13px;font-weight:bold;cursor:pointer;padding:12px}
button:disabled{opacity:.55;cursor:wait}
.link{display:block;text-align:center;color:#d4e4f6;font-size:13px;margin-top:20px}
#status{font-size:14px;line-height:1.6;text-align:center;overflow-wrap:anywhere}
.error{color:#ffb5b5}.success{color:#a9efc5}[hidden]{display:none!important}

/* Ajustes exclusivos do formulário de login */
#login{max-width:300px;margin:0 auto}
#login label{font-size:13px;margin-bottom:6px}
#login input{height:40px;padding:8px 12px;font-size:14px;margin-bottom:13px;border-radius:8px}
#login .password-field{position:relative;margin-bottom:16px}
#login .password-field input{display:block;padding-right:48px;margin:0}
#login .password-toggle{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:44px;min-height:44px;height:44px;padding:0;border:0;border-radius:7px;background:transparent;color:#24384e;line-height:0}
#login .password-toggle svg{width:20px;height:20px;pointer-events:none}
#login .password-toggle:focus-visible{outline:2px solid #477ab5;outline-offset:-5px}
#login #entrar{display:block;width:76%;max-width:228px;min-height:38px;margin:0 auto;padding:9px 14px;font-size:13px}
#login .link{margin-top:17px;font-size:12px}
</style>
</head>
<body>
<main class="container">
<img class="logo" src="assets/brasao-colonial.png" alt="Brasão oficial do Colonial">
<h1 id="titulo">Acesse sua conta</h1>
<p class="subtitle" id="subtitulo">O Colonial agora na palma da sua mão.</p>
<form id="cadastro" hidden>
<label for="nome">Nome completo</label>
<input id="nome" type="text" autocomplete="name" minlength="3" maxlength="120" required>
<label for="telefone">Celular com DDD</label>
<input id="telefone" type="tel" autocomplete="tel" maxlength="15" placeholder="(21) 99999-9999" required>
<label for="email">E-mail</label>
<input id="email" type="email" autocomplete="email" maxlength="254" required>
<label for="senha">Crie sua senha</label>
<input id="senha" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo de 8 caracteres" required>
<label for="confirmar">Confirme sua senha</label>
<input id="confirmar" type="password" autocomplete="new-password" required>
<button id="cadastrar" type="submit">CRIAR MINHA CONTA</button>
<a class="link" href="#" id="abrirLogin">Já possui uma conta? Entrar</a>
</form>
<form id="login" hidden>
<label for="loginEmail">E-mail ou CPF</label>
<input id="loginEmail" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="Digite seu e-mail ou CPF" required>
<label for="loginSenha">Senha</label>
<div class="password-field">
<input id="loginSenha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
<button id="toggleLoginSenha" class="password-toggle" type="button" aria-label="Mostrar senha" aria-controls="loginSenha" aria-pressed="false" title="Mostrar senha">
<svg id="loginEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
<svg id="loginEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6 Q12 0.8 19 6 M2.5 11 Q12 23 21.5 11 M5.8 14.5 L3.2 17.5 M9.1 16.8 L7.7 20 M12 17.4 V21 M14.9 16.8 L16.3 20 M18.2 14.5 L20.8 17.5"/></svg>
</button>
</div>
<button type="submit" id="entrar">ENTRAR</button>
<a href="#" class="link" id="abrirCadastro">Ainda não possui conta? Cadastre-se</a>
</form>
<p id="status" role="status" aria-live="polite"></p>
<button id="sair" type="button" hidden>SAIR DA CONTA</button>
<a class="link" href="./">Voltar à abertura</a>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/client.js"></script>
<script>
(()=>{
'use strict';
const sb=window.colonial?.client;
const $=id=>document.getElementById(id);
const digits=v=>String(v||'').replace(/\D/g,'');
let ocupado=false;

// Alternar apenas a visualização da senha; não altera a autenticação.
const campoSenhaLogin=$('loginSenha'), olhoLogin=$('toggleLoginSenha');
function senhaLoginVisivel(visivel){
    campoSenhaLogin.type=visivel?'text':'password';
    $('loginEye').toggleAttribute('hidden', !visivel);
    $('loginEyeOff').toggleAttribute('hidden', visivel);
    olhoLogin.setAttribute('aria-pressed',String(visivel));
    olhoLogin.setAttribute('aria-label',visivel?'Ocultar senha':'Mostrar senha');
    olhoLogin.title=visivel?'Ocultar senha':'Mostrar senha';
}
olhoLogin.addEventListener('click',()=>senhaLoginVisivel(campoSenhaLogin.type==='password'));
$('login').addEventListener('reset',()=>senhaLoginVisivel(false));
new MutationObserver(()=>{if($('login').hidden)senhaLoginVisivel(false);}).observe($('login'),{attributes:true,attributeFilter:['hidden']});
window.addEventListener('pagehide',()=>senhaLoginVisivel(false));

function mensagem(texto,tipo=''){$('status').textContent=texto;$('status').className=tipo;}
function mostrarCadastro(){$('titulo').textContent='Crie sua conta';$('subtitulo').textContent='Faça parte da comunidade Colonial.';$('cadastro').hidden=false;$('login').hidden=true;$('sair').hidden=true;}
function mostrarLogin(){$('titulo').textContent='Acesse sua conta';$('subtitulo').textContent='O Colonial agora na palma da sua mão.';$('cadastro').hidden=true;$('login').hidden=false;$('sair').hidden=true;}
function mostrarSessao(){$('cadastro').hidden=true;$('login').hidden=true;$('sair').hidden=false;}
function ocupadoEstado(valor){ocupado=valor;$('cadastrar').disabled=valor;$('entrar').disabled=valor;$('sair').disabled=valor;}
async function negarAcesso(texto){
    mostrarSessao();
    mensagem(texto,'error');
    const {error}=await sb.auth.signOut();
    if(!error)mostrarLogin();
}
async function finalizarCadastro(){
    mostrarSessao();
    mensagem('Verificando seu acesso...');
    const {data,error}=await sb.auth.getUser();
    if(error||!data?.user)throw new Error('Não foi possível validar seu acesso.');
    const usuario=data.user;
    // Prioridade ao cadastro oficial do associado; nunca criar perfil comum em seu lugar.
    const associado=await sb.from('associados').select('nome,situacao').eq('usuario_auth_id',usuario.id).maybeSingle();
    if(associado.error)throw new Error('Não foi possível consultar seu acesso. Tente novamente.');
    if(associado.data){
        if(!['ativo','pendente'].includes(associado.data.situacao)){
            await negarAcesso('Seu acesso está indisponível. Entre em contato com a administração.');
            return;
        }
    }else{
        const consulta=await sb.from('usuarios_app').select('nome,situacao').eq('usuario_id',usuario.id).maybeSingle();
        if(consulta.error)throw new Error('Não foi possível consultar seu cadastro.');
        let situacao=consulta.data?.situacao;
        if(!consulta.data){
            const meta=usuario.user_metadata||{};
            if(meta.cadastro_colonial_app!==true){
                await negarAcesso('Seu acesso ainda não está liberado. Entre em contato com a administração.');
                return;
            }
            const registro=await sb.rpc('registrar_usuario_app',{p_nome:meta.nome,p_telefone:meta.telefone});
            if(registro.error)throw new Error('Não foi possível concluir seu cadastro. Confira a confirmação do e-mail ou procure a administração.');
            situacao=registro.data;
        }
        if(situacao!=='ativo'){
            await negarAcesso('Seu acesso está indisponível. Entre em contato com a administração.');
            return;
        }
    }
    const sessao=await sb.auth.getSession();
    if(sessao.error||sessao.data.session?.user?.id!==usuario.id)throw new Error('Sua sessão foi alterada. Entre novamente.');
    location.replace('./?inicio=1');
}
$('cadastro').addEventListener('submit',async event=>{
    event.preventDefault();if(!sb||ocupado)return;
    const nome=$('nome').value.trim(),telefone=digits($('telefone').value),email=$('email').value.trim(),senha=$('senha').value;
    if(nome.length<3||nome.length>120)return mensagem('Informe seu nome completo.','error');
    if(![10,11].includes(telefone.length))return mensagem('Informe um telefone válido com DDD.','error');
    if(senha.length<8||!/[^\p{L}\p{N}\s]/u.test(senha))return mensagem('Use pelo menos 8 caracteres e um caractere especial.','error');
    if(senha!==$('confirmar').value)return mensagem('As senhas não coincidem.','error');
    ocupadoEstado(true);mensagem('Realizando cadastro...');
    try{
        const sessao=await sb.auth.getSession();
        if(sessao.error||sessao.data.session)throw new Error('Encerre a sessão atual antes de criar outra conta.');
        const {data,error}=await sb.auth.signUp({email,password:senha,options:{emailRedirectTo:new URL('cadastro-app.html',location.href).href,data:{cadastro_colonial_app:true,nome,telefone}}});
        if(error)throw error;
        $('cadastro').reset();
        if(data.session){await finalizarCadastro();}
        else{mostrarLogin();mensagem('Confira sua caixa de entrada e o spam. Se o cadastro estiver pendente, confirme seu e-mail antes de entrar.','success');}
    }catch(erro){mensagem('Não foi possível concluir: '+erro.message,'error');}
    finally{ocupadoEstado(false);}
});
$('login').addEventListener('submit',async event=>{
    event.preventDefault();if(!sb||ocupado)return;
    const identificador=$('loginEmail').value.trim(),senha=$('loginSenha').value;
    senhaLoginVisivel(false);
    const porEmail=identificador.includes('@');
    const cpf=digits(identificador);
    if(!porEmail&&(!/^[\d.\-\s]+$/.test(identificador)||cpf.length!==11))return mensagem('Informe seu e-mail ou CPF válido.','error');
    ocupadoEstado(true);mensagem('Verificando acesso...');
    try{
        if(porEmail){
            const {error}=await sb.auth.signInWithPassword({email:identificador,password:senha});
            if(error)throw new Error('Não foi possível entrar. Confira seu e-mail, senha e a confirmação do e-mail.');
        }else{
            const {data,error}=await sb.functions.invoke('login-cpf',{body:{cpf,senha}});
            if(error||!data?.access_token||!data?.refresh_token)throw new Error('Não foi possível entrar. Confira seu CPF e sua senha.');
            const resultado=await sb.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});
            if(resultado.error)throw new Error('Não foi possível iniciar sua sessão. Tente novamente.');
        }
        $('login').reset();
        await finalizarCadastro();
    }catch(erro){mensagem(erro.message||'Não foi possível entrar. Tente novamente.','error');}
    finally{ocupadoEstado(false);}
});
$('abrirLogin').onclick=e=>{e.preventDefault();if(ocupado)return;mensagem('');mostrarLogin();};
$('abrirCadastro').onclick=e=>{e.preventDefault();if(ocupado)return;mensagem('');mostrarCadastro();};
$('sair').onclick=async()=>{
    if(!sb||ocupado)return;ocupadoEstado(true);
    try{const {error}=await sb.auth.signOut();if(error)throw error;mensagem('');mostrarLogin();}
    catch(_){mensagem('Não foi possível sair. Tente novamente.','error');}
    finally{ocupadoEstado(false);}
};
async function iniciar(){
    if(!sb)return mensagem('Conexão indisponível. Atualize a página.','error');
    ocupadoEstado(true);
    try{
        const {data,error}=await sb.auth.getSession();if(error)throw error;
        if(data.session)await finalizarCadastro();
        else if(new URLSearchParams(location.search).get('modo')==='login')mostrarLogin();
        else mostrarCadastro();
    }catch(erro){mensagem(erro.message||'Não foi possível validar seu acesso.','error');mostrarSessao();}
    finally{ocupadoEstado(false);}
}
iniciar();
})();
</script>
</body>
</html>
